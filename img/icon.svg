  <path d="M248 112 H352 L416 176 V400 Q416 424 392 424 H248 Q224 424 224 400 V136 Q224 112 248 112 Z" fill="#FFFFFF"/>
  <path d="M352 112 V176 H416 Z" fill="#C9D6E3"/>
  <!-- text lines -->
  <rect x="264" y="232" width="112" height="22" rx="11" fill="#1B3A5C"/>
  <rect x="264" y="284" width="112" height="22" rx="11" fill="#1B3A5C"/>
  <rect x="264" y="336" width="72" height="22" rx="11" fill="#1B3A5C"/>
